name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/import_requirements.py
      - run: python scripts/build_site.py
      - run: python scripts/validate_site.py
      - run: python scripts/validate_requirements.py
      - run: node --check docs/assets/site.js
      - name: Ensure generated pages are committed
        run: git diff --exit-code -- content/requirements.json docs sitemap.xml robots.txt llms.txt
